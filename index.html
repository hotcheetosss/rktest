<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тренажёр РК1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow exam-sheet column; subject tabs → variant grid → one question per screen with lettered answer rows A–E */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#172033; --muted:#5B6578; --line:#DCE1EA;
  --accent:#2B4ACB; --accent-ink:#FFFFFF; --accent-soft:#E7ECFB;
  --ok:#1C7448; --ok-soft:#E2F2E9; --bad:#B3261E; --bad-soft:#FBE8E6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#171C27; --ink:#E6E9F0; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8FA5FF; --accent-ink:#0E121A; --accent-soft:#1E2744;
  --ok:#5EC890; --ok-soft:#13301F; --bad:#FF8F85; --bad-soft:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --ink:#E6E9F0; --muted:#9AA3B5; --line:#2A3142;
  --accent:#8FA5FF; --accent-ink:#0E121A; --accent-soft:#1E2744;
  --ok:#5EC890; --ok-soft:#13301F; --bad:#FF8F85; --bad-soft:#3B1A18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,32px);font-weight:700;line-height:1.15}
h2{font-size:18px;font-weight:500;line-height:1.3}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0;max-width:60ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.tab{flex:1 1 220px;border:0;background:transparent;padding:10px 14px;border-radius:9px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tab b{font-weight:600}
.tab span{font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.8}

/* variant grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;font:600 17px/1.2 var(--f-body)}
.count{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.best{font:500 13px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-height:17px}
.best.has{color:var(--ok)}
.card-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.card .btn.primary{flex:1}
.card.mix{border-style:dashed}
.card.mock{grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent)}
.card.mock .tagline{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card.mock .card-actions{max-width:420px}

/* quiz */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .back{border:0;background:none;color:var(--muted);padding:0;font-size:14px}
.bar .back:hover{color:var(--accent)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1 1 100%}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:12px;font:500 13px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;flex:1 1 100%}
.meta .ok{color:var(--ok)} .meta .bad{color:var(--bad)}
.qtext{font:500 clamp(18px,3.4vw,21px)/1.45 var(--f-body);margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .l{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font:500 13px/1 var(--f-mono);color:var(--muted)}
.opt .t{min-width:0;padding-top:3px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
kbd{font:500 12px/1 var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px}

/* result */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grade{font:700 44px/1 var(--f-display);color:var(--accent);min-width:84px}
.score-num{display:flex;flex-direction:column;gap:4px}
.score-num b{font:600 22px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.score-num span{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0}
.item .q{margin:0;font-weight:500}
.item .q small{font:500 12px var(--f-mono);color:var(--muted);margin-right:6px}
.item .a{margin:0;font-size:15px;padding-left:12px;border-left:2px solid var(--ok);color:var(--ok)}
.item .y{margin:0;font-size:15px;padding-left:12px;border-left:2px solid var(--bad);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.empty{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"hps":{"title":"История и философия науки","k":6,"qs":[["Оформление науки в качестве социального института связано с…:","развитием теоретического естествознания и началом использования в науке эксперимента.","проведением экспериментов использования в науке эксперимента.","возникновением первых научных журналов.","возникновением лабораторий.","превращением науки в производство."],["Революция в естествознании конца ХIХ–начала ХХ века привела к утверждению образа науки:","как системы знаний, находящейся в постоянном движении, постоянно совершенствующейся","как совокупности готовых ответов о природе окружающего мира","как теории, охватывающей все проблемы окружающей реальности","как системы неизменных знаний","как синтеза с религией и философией"],["Цели науки можно сформулировать как:","описание, объяснение и предсказание процессов и явлений действительности на основе открываемых ею законов","предотвращение негативных воздействий человека на окружающую среду","обслуживание практических потребностей человеческого общества","понимание окружающей действительности и предоставление возможности использовать ее в интересах человека","образование ноосферы"],["Метод познания при помощи расчленения или разложения предметов исследования на составные части называется:","анализом","синтезом","аналогией","классификацией","дедукцией"],["Местом возникновения науки в форме научных программ считают:","Древнюю Грецию","Египет","Китай","Римскую империю","Древнюю Индию"],["Философские основания науки обеспечивают:","определение методологических ориентиров научного поиска","соответствие научного поиска теории познания","стыковку научных картин мира","подтверждение уникальности научного знания","определение критериев научности"],["Для выявления общих закономерностей развития научного познания методология науки опирается на…:","материал истории развития конкретных наук","эмпирические закономерности в естествознании","психологические аспекты научного творчества","математические методы исследования","статистику"],["Научный факт может быть рассмотрен как","форма эмпирического знания","компонент научный деятельности","форма теоретического знания","элемент метода научного познания","аксиома"],["Основное отличие художественного освоения деятельности от научного познания в том, что","любое отражение объективного мира в искусстве одновременно выражает ценностное отношение человека к предмету","художественное освоение действительности не ориентировано на практическое использование","отражение окружающей действительности в искусстве может не соответствовать реальности","в искусстве преобладает образное отражение мира","не требует экспериментального подтверждения"],["Формализация – это:","отображение объекта или явления в знаковой форме какого-либо искусственного языка","мысленное отвлечение от несуществующих свойств, связей, отношений предметов","мысленное конструирование неосуществимых объектов","метод перехода от знания отдельных фактов к знанию общего","схематизация"],["Сложные саморазвивающиеся системы являются предметом изучения:","постнеклассического этапа истории науки","донаучного этапа истории науки","классического этапа истории науки","неклассического этапа истории науки","предклассического этапа развития науки"],["В развитии позитивизма выделяют следующие основные этапы","Позитивизм, неопозитивизм и постпозитивизм","Рационализм, эмпиризм и иррационализм","Классическая, неклассическая и постнеклассическая наука","Античный, средневековый и современный позитивизм","Метафизика, диалектика и феноменология"],["Методологическое направление, признающее движущей силой развития науки внутренние, интеллектуальные (как философские, так и собственно научные) факторы:","интернализм","традиционализм","интуитивизм","скептицизм","экстернализм"],["Интерсубъективность научного знания проявляется в том, что:","из результатов научной деятельности исключается все субъективное, связанное со спецификой самого ученого и его мировосприятия","научное знание вырабатывается научным сообществом","научное знание отчуждается от личности","научное знание индивидуально","научное знание уникально"],["К формам научного познания относятся:","научные факты, законы, гипотезы, научные идеи, научные проблемы, теории","эксперимент, анализ, синтез, системный подход","постановка проблемы, создание гипотезы","эмпирическое познание","воображение"],["Метод познания при помощи абстрактного расчленения или разложения предметов исследования на составные части:","анализ","синтез","аналогия","индукция","дедукция"],["Какое из положений выражает этику научного познания:","нравственная оценка относится только к использованию результатов научных положений и открытий","научные положения не могут оцениваться с точки зрения этики","достижения науки не могут быть безнравственными","научные теории могут быть как нравственными, так и безнравственными","все, что объективно истинно, то нравственно"],["Определите прагматическое суждение об истине:","это знание, ведущее к достижению цели","это знание, с которым все согласны","это отражение действительности в сознании, независимо от человека","это значение, не зависящее от действительности","это род веры"],["Каждая наука и научная дисциплина включает в себя четыре необходимых компонента в их единстве: субъект науки, объект науки, система методов и приемов, специфический язык, - так считал:","Р. Мертон","К. Поппер","К. Маркс","А. Койре","В. Вернадский"],["Какой ответ об источнике познания верен для сенсуализма:","источником познания являются ощущения","источником познания является разум","источником познания является интуиция","источником познания является опыт","источником познания являются разум и ощущения"],["Согласие с каким из положений выражает позицию агностицизма:","некоторые вещи никогда не станут объектами нашего познания","процесс познания бесконечен","все наши знания приблизительны","человек сможет до конца исчерпать тайны природы","в науке есть неразрешимые задачи"],["Проблема познаваемости мира являетс const LETTERS = ['A','B','C','D','E'];
const app = document.getElementById('app');
const S = {subj: 'hps', screen: 'home'};
let run = null;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const plural = (n, one, few, many) => { const m10=n%10, m100=n%100; return m10===1&&m100!==11?one:(m10>=2&&m10<=4&&(m100<12||m100>14)?few:many) };
const qWord = n => n + ' ' + plural(n,'вопрос','вопроса','вопросов');

function groups(key){
  const d = DATA[key], g = Array.from({length:d.k}, () => []);
  d.qs.forEach((_, i) => g[i % d.k].push(i));
  return g;
}
function grade(p){
  const t=[[95,'A'],[90,'A−'],[85,'B+'],[80,'B'],[75,'B−'],[70,'C+'],[65,'C'],[60,'C−'],[55,'D+'],[50,'D'],[25,'FX'],[0,'F']];
  return t.find(x => p >= x[0])[1];
}
const bestKey = (key, v) => `rk1:${key}:${v}`;

/* ---------- home ---------- */
function renderHome(){
  S.screen = 'home'; run = null;
  const d = DATA[S.subj], g = groups(S.subj);
  const tabs = Object.entries(DATA).map(([k, x]) =>
    `<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===S.subj}" data-subj="${k}"><b>${esc(x.title)}</b><span>${qWord(x.qs.length)} · ${x.k} вариантов</span></button>`).join('');
  const cards = g.map((ids, v) => {
    const b = store.get(bestKey(S.subj, v));
    return `<div class="card">
      <div class="card-top"><h3>Вариант ${v+1}</h3><span class="count">${qWord(ids.length)}</span></div>
      <div class="best ${b!==null?'has':''}">${b!==null ? 'Лучший результат: ' + b + '%' : 'Ещё не проходили'}</div>
      <div class="card-actions"><button class="btn primary" data-start="${v}">Начать</button><button class="btn" data-review="${v}">Ответы</button></div>
    </div>`;
  }).join('');
  const bm = store.get(bestKey(S.subj, 'all'));
  const bp = store.get(bestKey(S.subj, 'mock'));
  const mockCard = d.mock ? `<div class="card mock">
      <span class="tagline">Вопросы из пробного теста</span>
      <div class="card-top"><h3>${esc(d.mock.title)}</h3><span class="count">${qWord(d.mock.ids.length)}</span></div>
      <div class="best ${bp!==null?'has':''}">${bp!==null ? 'Лучший результат: ' + bp + '%' : 'Ещё не проходили'}</div>
      <div class="card-actions"><button class="btn primary" data-start="mock">Начать</button><button class="btn" data-review="mock">Ответы</button></div>
    </div>` : '';
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">Рубежный контроль 1 · 2026–2027</span>
      <h1>Тренажёр РК1</h1>
      <p class="lead">Выберите предмет и вариант. Ответы перемешиваются при каждом запуске, правильный вариант подсвечивается сразу после выбора.</p>
    </header>
    <div class="tabs" role="tablist">${tabs}</div>
    <div class="grid">${mockCard}${cards}
      <div class="card mix">
        <div class="card-top"><h3>Все вопросы</h3><span class="count">${qWord(d.qs.length)}</span></div>
        <div class="best ${bm!==null?'has':''}">${bm!==null ? 'Лучший результат: ' + bm + '%' : 'В случайном порядке'}</div>
        <div class="card-actions"><button class="btn primary" data-start="all">Начать</button></div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- quiz ---------- */
function startRun(v, ids){
  const all = groups(S.subj);
  if(!ids) ids = v === 'all' ? shuffle(DATA[S.subj].qs.map((_, i) => i)) : v === 'mock' ? DATA[S.subj].mock.ids : all[v];
  run = { v, ids, pos: 0, answers: [], label: v === 'all' ? 'Все вопросы' : v === 'mistakes' ? 'Работа над ошибками' : v === 'mock' ? DATA[S.subj].mock.title : 'Вариант ' + (v+1) };
  renderQuestion();
}
function renderQuestion(){
  S.screen = 'quiz';
  const d = DATA[S.subj], qi = run.ids[run.pos], q = d.qs[qi];
  run.opts = shuffle(q.slice(1).map((t, i) => ({t, ok: i === 0})));
  run.answered = false;
  const ok = run.answers.filter(a => a.ok).length, bad = run.answers.length - ok;
  app.innerHTML = `
    <div class="bar">
      <button class="back" id="back">← ${esc(d.title)} · ${run.label}</button>
      <div class="meta"><span>Вопрос ${run.pos+1} из ${run.ids.length}</span><span><span class="ok">✓ ${ok}</span>&nbsp;&nbsp;<span class="bad">✗ ${bad}</span></span></div>
      <div class="progress"><i style="width:${run.pos/run.ids.length*100}%"></i></div>
    </div>
    <p class="qtext">${esc(q[0])}</p>
    <div class="opts">${run.opts.map((o, i) => `<button class="opt" id="opt-${i}" data-opt="${i}"><span class="l">${LETTERS[i]}</span><span class="t">${esc(o.t)}</span></button>`).join('')}</div>
    <div class="next-row">
      <span class="hint">Клавиши: <kbd>1</kbd>–<kbd>5</kbd> или <kbd>A</kbd>–<kbd>E</kbd>, далее <kbd>Enter</kbd></span>
      <button class="btn primary" id="next" hidden>${run.pos+1 === run.ids.length ? 'Результат' : 'Дальше →'}</button>
    </div>`;
  window.scrollTo(0,0);
}
function choose(i){
  if(run.answered) return;
  run.answered = true;
  const o = run.opts[i], qi = run.ids[run.pos];
  run.answers.push({qi, ok: o.ok, chosen: o.t});
  app.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if(run.opts[j].ok) b.classList.add('right');
    else if(j === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const ok = run.answers.filter(a => a.ok).length;
  app.querySelector('.meta').lastElementChild.innerHTML = `<span class="ok">✓ ${ok}</span>&nbsp;&nbsp;<span class="bad">✗ ${run.answers.length-ok}</span>`;
  app.querySelector('.progress i').style.width = (run.pos+1)/run.ids.length*100 + '%';
  const nb = document.getElementById('next'); nb.hidden = false; nb.focus({preventScroll:true});
}
function next(){
  if(!run || !run.answered) return;
  run.pos++;
  run.pos < run.ids.length ? renderQuestion() : renderResult();
}

/* ---------- result ---------- */
function renderResult(){
  S.screen = 'result';
  const d = DATA[S.subj], n = run.answers.length, ok = run.answers.filter(a => a.ok).length;
  const p = Math.round(ok / n * 100), wrong = run.answers.filter(a => !a.ok);
  if(run.v !== 'mistakes'){
    const k = bestKey(S.subj, run.v), prev = store.get(k);
    if(prev === null || p > +prev) store.set(k, p);
  }
  const items = wrong.map(a => {
    const q = d.qs[a.qi];
    return `<div class="item"><p class="q">${esc(q[0])}</p><p class="y">${esc(a.chosen)}</p><p class="a">${esc(q[1])}</p></div>`;
  }).join('');
  app.innerHTML = `
    <div class="bar"><button class="back" id="back">← ${esc(d.title)}</button></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${esc(run.label)}</span><h1>${p >= 85 ? 'Отлично сдано' : p >= 50 ? 'Зачёт, но есть ошибки' : 'Нужно повторить'}</h1></div>
    <div class="score">
      <div class="grade">${grade(p)}</div>
      <div class="score-num"><b>${ok} из ${n} · ${p}%</b><span>Оценка по шкале КарУ: A — от 95%, B+ — от 85%, порог D — 50%</span></div>
    </div>
    <div class="actions">
      ${wrong.length ? `<button class="btn primary" id="redo-wrong">Повторить ошибки (${wrong.length})</button>` : ''}
      <button class="btn ${wrong.length ? '' : 'primary'}" id="redo">Пройти заново</button>
      <button class="btn" id="home">К вариантам</button>
    </div>
    <h2>${wrong.length ? 'Ошибки и правильные ответы' : 'Ошибок нет'}</h2>
    ${wrong.length ? `<div class="list">${items}</div>` : '<p class="empty">Все ответы верные. Можно переходить к следующему варианту.</p>'}`;
  run.wrongIds = wrong.map(a => a.qi);
  window.scrollTo(0,0);
}

/* ---------- answers list ---------- */
function renderReview(v){
  S.screen = 'review';
  const d = DATA[S.subj], ids = v === 'mock' ? d.mock.ids : groups(S.subj)[v];
  const name = v === 'mock' ? d.mock.title : 'Вариант ' + (v+1);
  app.innerHTML = `
    <div class="bar"><button class="back" id="back">← ${esc(d.title)}</button></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${esc(d.title)} · ${qWord(ids.length)}</span><h1>${esc(name)}: ответы</h1></div>
    <div class="actions"><button class="btn primary" data-start="${v}">Пройти тест</button></div>
    <div class="list">${ids.map((qi, n) => `<div class="item"><p class="q"><small>${n+1}</small>${esc(d.qs[qi][0])}</p><p class="a">${esc(d.qs[qi][1])}</p></div>`).join('')}</div>`;
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.subj){ S.subj = t.dataset.subj; store.set('rk1:subj', S.subj); renderHome(); }
  else if(t.dataset.start !== undefined){ const v = t.dataset.start; startRun(v === 'all' || v === 'mock' ? v : +v); }
  else if(t.dataset.review !== undefined){ const v = t.dataset.review; renderReview(v === 'mock' ? v : +v); }
  else if(t.dataset.opt !== undefined){ choose(+t.dataset.opt); }
  else if(t.id === 'next'){ next(); }
  else if(t.id === 'back' || t.id === 'home'){ renderHome(); }
  else if(t.id === 'redo'){ startRun(run.v, run.v === 'all' ? null : run.v === 'mistakes' ? run.ids : undefined); }
  else if(t.id === 'redo-wrong'){ const ids = shuffle(run.wrongIds); startRun('mistakes', ids); }
});
document.addEventListener('keydown', e => {
  if(S.screen !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  let i = '12345'.indexOf(k); if(i < 0) i = LETTERS.indexOf(k); if(i < 0) i = 'ФИСВУ'.indexOf(k);
  if(i >= 0 && !run.answered){ e.preventDefault(); choose(i); }
  else if((e.key === 'Enter' || e.key === ' ') && run.answered){ e.preventDefault(); next(); }
});

const saved = store.get('rk1:subj'); if(saved && DATA[saved]) S.subj = saved;
renderHome();
